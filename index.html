<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!--
    Site-level metadata. The values below mirror CONFIG.site in the script at the
    bottom and are refreshed from it on load. Keep both in sync when you change
    the page title/description; the JS-sync guarantees the <title> and meta
    <description> always match CONFIG.
  -->
  <title>Dr. Rajneesh Kant | Back to Nature Spine Clinic</title>
  <meta name="description"
    content="Book an appointment, message on WhatsApp, download the patient app, or find clinic details for Dr. Rajneesh Kant at Back to Nature Spine Clinic.">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#0d1f6e">

  <!-- Favicon: assets/drk-favicon.webp(clinic logo). Plain static file — swap the PNG to change it. -->
  <link rel="icon" type="image/png" href="assets/drk-favicon.webp">

  <!-- Application manifest + home-screen (PWA) support. manifest.webmanifest
       drives the mobile "Add to Home Screen / Install app" flow; the
       apple-touch-icon is what iOS uses for the home-screen icon. -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Back to Nature Spine Clinic">

  <!-- Open Graph -->
  <meta property="og:title" content="Dr. Rajneesh Kant | Back to Nature Spine Clinic">
  <meta property="og:description"
    content="Spine & orthopaedic care focused on natural recovery and patient-first treatment. Book an appointment or get in touch.">
  <meta property="og:type" content="profile">
  <meta property="og:url" content="https://drrajneeshkant.com/">
  <!-- og:image ships in assets/ as og-image.png; swap for an absolute URL once deployed so WhatsApp/Instagram previews resolve -->
  <meta property="og:image" content="assets/og-image.png">
  <meta property="og:site_name" content="Back to Nature Spine Clinic">
  <meta property="og:locale" content="en_IN">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Dr. Rajneesh Kant | Back to Nature Spine Clinic">
  <meta name="twitter:description"
    content="Spine & orthopaedic care focused on natural recovery and patient-first treatment. Book an appointment or get in touch.">
  <meta name="twitter:image" content="assets/og-image.png">

  <!-- Styles — split by concern across css/. Load order matters here
       (variables → base → layout → components → sections → responsive)
       so the cascade and specificity behave predictably. -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/cta.css">
  <link rel="stylesheet" href="css/links.css">
  <link rel="stylesheet" href="css/app-card.css">
  <link rel="stylesheet" href="css/clinic-info.css">
  <link rel="stylesheet" href="css/social.css">
  <link rel="stylesheet" href="css/footer.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>

  <a class="skip-link" href="#main">Skip to content</a>

    <footer id="footer-mount"></footer>

      /* ====================================================================

      /* ====================================================================
         Google Play badge — inline SVG in Google's official badge style
         (rounded black button, four-colour Play triangle, "GET IT ON" +
         "Google Play"). No external images/PNG screenshots.

      const GOOGLE_PLAY_BADGE =
        '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 135 40" aria-hidden="true" focusable="false">' +
        '<rect width="135" height="40" rx="9" fill="#000"/>' +
        '<g transform="translate(14 8) scale(0.084)">' +
        '<path fill="#EA4335" d="M119.553141,134.916362 L1.0599006,259.060547 C3.75619448,268.616998 10.7182836,276.3906 19.9208658,280.119977 C29.1234481,283.849353 39.5331235,283.115716 48.121672,278.132484 L181.448642,202.197919 L119.553141,134.916362 Z"/>' +

      /* ====================================================================
         Small DOM/helpers
      ==================================================================== */
      const SVG_NS = "http://www.w3.org/2000/svg";

      function el(tag, attrs, children) {
        const node = document.createElement(tag);
        for (const [key, value] of Object.entries(attrs || {})) {
          if (value === null || value === undefined) continue;
          if (key === "class") node.className = value;
          else node.setAttribute(key, value);
        }
        if (children === null || children === undefined) children = [];
        else if (!Array.isArray(children)) children = [children];
        children.forEach(function (child) {
          node.appendChild(typeof child === "string" ? document.createTextNode(child) : child);
        });
        return node;
      }

      function svgIcon(id) {
        const svg = document.createElementNS(SVG_NS, "svg");
        svg.setAttribute("viewBox", "0 0 24 24");
        svg.setAttribute("aria-hidden", "true");
        svg.setAttribute("focusable", "false");
        svg.innerHTML = ICONS[id] || "";
        return svg;
      }

      function slugify(str) {
        return String(str || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
      }

      function analyticsId(kind, name) {
        return [CONFIG.analytics.prefix, kind, slugify(name)].filter(Boolean).join("-");
      }

      function isExternal(url) {
        return /^https?:\/\//i.test(url);
      }

      function waUrl() {
        return CONFIG.contact && CONFIG.contact.whatsapp ? "https://wa.me/" + CONFIG.contact.whatsapp : "#";
      }

      function ctaUrl(c) {
        return c.whatsapp ? waUrl() : (c.url || "#");
      }

      function socialUrl(s) {
        return s.id === "whatsapp" ? waUrl() : (s.url || "#");
      }

      function linkUrl(link) {
        if (link.social) {
          const s = CONFIG.socials.find(function (item) { return item.id === link.social; });
          return s ? socialUrl(s) : "#";
        }
        return link.url || "#";
      }

      function applyHref(a, url, placeholder) {
        a.href = url;
        if (isExternal(url)) {
          a.setAttribute("target", "_blank");
          a.setAttribute("rel", "noopener");
        }
        // Placeholder links must not trigger a scroll jump to the top of the page.
        if (placeholder) {
          a.addEventListener("click", function (event) { event.preventDefault(); });
        }
      }

      /* ====================================================================
         Section builders
      ==================================================================== */
      function buildProfile(cfg) {
        const header = el("header", { class: "profile" });

        let avatar;
        if (cfg.avatar.image) {
          avatar = el("span", { class: "avatar" }, [
            el("img", {
              class: "avatar-img",
              src: cfg.avatar.image,
              alt: cfg.avatar.imageAlt,
              width: "96",
              height: "96",
            }),
          ]);
        } else {
          // Initials fallback — decorative because the real name is announced
          // by the adjacent <h1>, so it is hidden from the accessibility tree.
          avatar = el("span", { class: "avatar", "aria-hidden": "true" }, [
            el("span", { class: "avatar-initials" }, cfg.avatar.initials),
          ]);
        }
        header.appendChild(avatar);

        header.appendChild(el("h1", { class: "profile-name" }, cfg.name));
        header.appendChild(el("p", { class: "clinic-name" }, cfg.clinic));
        header.appendChild(el("p", { class: "bio" }, cfg.bio));

        if (cfg.verified) {
          const badge = el("span", { class: "verified-badge" }, [
            svgIcon("check"),
            "Verified clinic profile",
          ]);
          header.appendChild(badge);
        }

        return header;
      }

      function buildCtas(cfg) {
        const group = el("div", { class: "cta-group" });
        cfg.forEach(function (c) {
          const url = ctaUrl(c);
          const a = el("a", {
            class: "btn btn-" + c.variant,
            "data-analytics-id": analyticsId("cta", c.label),
            "aria-label": c.label,
          }, [svgIcon(c.icon), el("span", {}, c.label)]);
          applyHref(a, url, !!c.placeholder);
          group.appendChild(a);
        });
        return group;
      }

      function buildLinks(cfg) {
        const nav = el("nav", { "aria-label": "Useful links" });
        nav.appendChild(el("p", { class: "section-label" }, "Links"));

        const card = el("div", { class: "links-card" });
        cfg.forEach(function (link) {
          const url = linkUrl(link);
          const a = el("a", {
            class: "link-item",
            "data-analytics-id": analyticsId("link", link.title),
          }, [
            el("span", { class: "link-icon", "aria-hidden": "true" }, [svgIcon(link.icon)]),
            el("span", { class: "link-text" }, [
              el("span", { class: "link-title" }, link.title),
              el("span", { class: "link-sub" }, link.subtitle),
            ]),
            el("span", { class: "link-chevron", "aria-hidden": "true" }, [svgIcon("chevron")]),
          ]);
          applyHref(a, url, !!link.placeholder);
          card.appendChild(a);
        });
        nav.appendChild(card);
        return nav;
      }

      function buildApp(cfg) {
        const section = el("section", { "aria-label": "Patient app" });
        section.appendChild(el("p", { class: "section-label" }, "Patient App"));

        const card = el("div", { class: "app-card" });
        card.appendChild(el("span", { class: "app-mark", "aria-hidden": "true" }, [svgIcon("smartphone")]));
        card.appendChild(el("h2", { class: "app-title" }, cfg.title));
        card.appendChild(el("p", { class: "app-desc" }, cfg.description));

        const link = el("a", {
          class: "play-link",
          href: cfg.playUrl,
          "data-analytics-id": analyticsId("app", "google-play"),
          "aria-label": "Download the " + cfg.title + " on Google Play",
        });
        if (isExternal(cfg.playUrl)) {
          link.setAttribute("target", "_blank");
          link.setAttribute("rel", "noopener");
        }
        link.insertAdjacentHTML("beforeend", GOOGLE_PLAY_BADGE);
        card.appendChild(link);

        const download = el("a", {
          class: "btn btn-primary app-download",
          href: cfg.playUrl,
          "data-analytics-id": analyticsId("app", "download"),
        }, [svgIcon("smartphone"), el("span", {}, "Download App")]);
        if (isExternal(cfg.playUrl)) {
          download.setAttribute("target", "_blank");
          download.setAttribute("rel", "noopener");
        }
        card.appendChild(download);

        section.appendChild(card);
        return section;
      }

      function clinicRow(row) {
        const value = row.href
          ? el("a", { class: "info-value", href: row.href }, row.value)
          : el("span", { class: "info-value" }, row.value);
        return el("div", { class: "info-row" }, [
          el("span", { class: "info-icon", "aria-hidden": "true" }, [svgIcon(row.icon)]),
          el("span", { class: "info-text" }, [
            el("span", { class: "info-label" }, row.label),
            value,
          ]),
        ]);
      }

      function buildClinic(cfg) {
        const section = el("section", { "aria-label": "Clinic information" });
        section.appendChild(el("p", { class: "section-label" }, "Clinic Information"));

        const card = el("div", { class: "clinic-card" });
        card.appendChild(el("h2", { class: "clinic-head" }, [svgIcon("clinic"), cfg.name]));

        if (cfg.hours) {
          card.appendChild(clinicRow({ label: "Hours", icon: "clock", value: cfg.hours }));
        }

        cfg.branches.forEach(function (branch) {
          const block = el("div", { class: "clinic-branch" });
          block.appendChild(el("h3", { class: "branch-head" }, branch.label));

          branch.rows.forEach(function (row) {
            block.appendChild(clinicRow(row));
          });

          const maps = branch.maps;
          const mapsBtn = el("a", {
            class: "maps-btn",
            href: maps.url,
            "data-analytics-id": analyticsId("maps", branch.label),
          }, [svgIcon("pin"), maps.label]);
          applyHref(mapsBtn, maps.url, !!maps.placeholder);
          block.appendChild(mapsBtn);

          card.appendChild(block);
        });

        section.appendChild(card);
        return section;
      }

      function buildSocials(cfg) {
        const nav = el("nav", { "aria-label": "Follow on social media" });
        const row = el("div", { class: "social-row" });
        cfg.forEach(function (s) {
          const url = socialUrl(s);
          const isPlaceholder = s.id !== "whatsapp" && s.placeholder;
          const btn = el("a", {
            class: "social-btn",
            "data-brand": s.id,
            "data-analytics-id": analyticsId("social", s.id),
            "aria-label": s.label,
          }, [svgIcon(s.id)]);
          applyHref(btn, url, isPlaceholder);
          row.appendChild(btn);
        });
        nav.appendChild(row);
        return nav;
      }

      function buildFooter(cfg) {
        const footer = el("footer");
        footer.appendChild(el("hr", { class: "divider", "aria-hidden": "true" }));
        footer.appendChild(el("p", { class: "copyright" }, cfg.text.replace("© {year}", "© " + new Date().getFullYear())));
        return footer;
      }

      /* ====================================================================
         Head metadata sync (config is the single source of truth at runtime).
         Note: the favicon is not generated here — it is the static file
         assets/drk-favicon.webp, so the clinic logo can be swapped freely.
      ==================================================================== */
      function syncHeadMeta(config) {
        document.title = config.site.title;

        const sets = [
          ["name", "description", config.site.description],
          ["name", "theme-color", config.brand.themeColor],
          ["property", "og:title", config.site.title],
          ["property", "og:description", config.site.description],
          ["property", "og:url", config.site.url],
          ["property", "og:image", config.site.ogImage],
          ["property", "og:site_name", config.site.title],
          ["property", "og:locale", config.site.locale],
          ["name", "twitter:title", config.site.title],
          ["name", "twitter:description", config.site.description],
          ["name", "twitter:image", config.site.ogImage],
        ];
        sets.forEach(function (tuple) {
          const selector = tuple[0] === "property" ? 'meta[property="' + tuple[1] + '"]' : 'meta[name="' + tuple[1] + '"]';
          const meta = document.querySelector(selector);
          if (meta) meta.setAttribute("content", tuple[2]);
        });
      }

      /* ====================================================================
         Placeholder audit — every link that still needs a real URL is
         console.warn'd on load, so a "#" is never shipped silently.
      ==================================================================== */
      function auditPlaceholders(config) {
        const pending = [];
        function note(kind, label, url) {
          if (url === "#" || url === "" || url === null || url === undefined) {
            pending.push({ kind: kind, label: label, url: url || "#" });
          }
        }

        config.ctas.forEach(function (c) { note("CTA", "“" + c.label + "”", ctaUrl(c)); });
        // Links that reference CONFIG.socials resolve to the socials entry's
        // URL, so they are audited in the socials pass below (single source).
        config.links.forEach(function (l) { if (!l.social) note("link", l.title, linkUrl(l)); });
        config.socials.forEach(function (s) { note("social", s.label, socialUrl(s)); });
        note("app", "Google Play badge (" + config.app.title + ")", config.app.playUrl);
        config.clinic.branches.forEach(function (b) {
          note("maps", b.maps.label + " (" + b.label + ")", b.maps.url);
        });

        if (pending.length) {
          const lines = pending.map(function (p) {
            return "  - (" + p.kind + ") " + p.label + " -> " + p.url;
          });
          console.warn(
            "[config] " + pending.length + " placeholder link(s) still need a real URL:\n" + lines.join("\n")
          );
        } else {
          console.info("[config] All links configured — no placeholders remaining.");
        }
      }

      /* ====================================================================
         Init
      ==================================================================== */
      function mount(id, node) {
        document.getElementById(id).appendChild(node);
      }

      mount("profile-mount", buildProfile(CONFIG.profile));
      mount("cta-mount", buildCtas(CONFIG.ctas));
      mount("links-mount", buildLinks(CONFIG.links));
      mount("app-mount", buildApp(CONFIG.app));
      mount("clinic-mount", buildClinic(CONFIG.clinic));
      mount("socials-mount", buildSocials(CONFIG.socials));
      mount("footer-mount", buildFooter(CONFIG.footer));

      syncHeadMeta(CONFIG);
      auditPlaceholders(CONFIG);

      // Installable-app support: register the service worker from sw.js so
      // browsers offer "Add to Home Screen / Install" and the page caches
      // offline. Guarded — fails silently on file://, http:// or old browsers.
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("sw.js").catch(function (err) {
            console.warn("[pwa] service worker registration failed:", err);
          });
        });
      }
    })();
  </script>

</body>
